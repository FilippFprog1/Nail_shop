<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Корзина</title>
  <script>
    window.tailwind = { config: { darkMode: 'class' } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="images/mainicon.ico" />
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <a href="index.html" class="text-lg font-semibold text-blue-600">← Вернуться</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-4">Ваша корзина</h1>
    <div class="main-cart bg-white rounded-lg shadow p-4 mb-6"></div>

    <section class="bg-white rounded-lg shadow p-4">
      <h2 class="font-semibold mb-3">Данные для заказа</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input id="ename" class="border rounded px-3 py-2" placeholder="Имя" required>
        <input id="email" type="email" class="border rounded px-3 py-2" placeholder="Email" required>
        <input id="ephone" class="border rounded px-3 py-2" placeholder="Телефон" required>
      </div>
      <div class="mt-4 flex items-center gap-3">
        <button class="send-email bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Заказать</button>
        <button id="clear-all" class="text-sm text-red-600">Очистить корзину</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("uz6bQWWH9QTfwsCHD"); // вставь свой Public Key
    })();
  </script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/cart.js"></script>
  <script>
    $('#clear-all').on('click', function(){ localStorage.removeItem('cart'); location.reload(); });
  </script>
</body>
</html>
