<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="icon" type="image/x-icon" href="images/mainicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <p>
            <a href="index.html" class="cart-button">Перейти на главную страницу</a>
        </p>
    </header>
    <main>
        <div class="main-cart"></div>
        <div class="email-field">
            <p>Имя: 
            <input type="text" id="ename" name="ename" autocomplete="name" required>
            </p>

            <p>Email: 
            <input type="email" id="email" name="email" autocomplete="email" required>
            </p>

            <p>Телефон: 
            <input type="tel" id="ephone" name="ephone" autocomplete="tel" required>
            </p>
            <p><button class="send-email">Заказать</button></p>
        </div>
    </main>
    <footer>

    </footer>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
